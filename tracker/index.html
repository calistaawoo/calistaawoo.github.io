<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>summer leetcode</title>
  <style>
    :root {
      --bg: #E7F0F5;
      --deep: #1B4F87;
      --muted: #4A7391;
      --mid: #5B9BD5;
      --border: #A8CFE8;
      --card: #FFFFFF;
      --gold: #F5B921;
      --ahead: #0b84ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--deep);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem 2rem 2.25rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 30px rgba(27, 79, 135, 0.08);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0.65rem;
    }

    .star {
      color: #f7e8c1;
      font-size: 26px;
      line-height: 1;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: var(--bg);
      border-radius: 12px;
      padding: 0.9rem 0.5rem;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: lowercase;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 600;
      line-height: 1;
    }

    .stat-value.status {
      font-size: 15px;
      padding-top: 5px;
    }

    .bar-track {
      height: 9px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--gold);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .progress-label {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .thanks {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 0;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      padding: 0.85rem 1rem;
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      flex: 2;
      background: var(--gold);
      color: #5a4204;
      border: none;
    }

    .btn-primary:hover {
      background: #e8ad12;
    }

    .burst-source.is-bursting {
      box-shadow: 0 0 0 0 rgba(245, 185, 33, 0.12);
      animation: burst-glow 320ms ease-out;
    }

    @keyframes burst-glow {
      0% {
        box-shadow: 0 0 0 0 rgba(245, 185, 33, 0.04);
        transform: scale(1);
      }

      50% {
        box-shadow: 0 0 0 2px rgba(245, 185, 33, 0.05);
        transform: scale(1.002);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(245, 185, 33, 0);
        transform: scale(1);
      }
    }

    .btn-undo {
      flex: 1;
      background: var(--card);
      color: var(--mid);
      border: 1px solid var(--border);
    }

    .btn-undo:hover {
      border-color: var(--mid);
    }

    .reset {
      display: block;
      margin: 1.25rem auto 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px;
    }

    .reset:hover {
      color: var(--mid);
    }

    .edit-toggle {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--gold);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
    }

    .edit-toggle:hover {
      color: #e8ad12;
    }

    .edit-toggle.is-signed-in {
      color: var(--gold);
    }

    .login-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 1.5rem;
      padding: 0.9rem;
      background: var(--bg);
      border-radius: 12px;
    }

    .login-panel input {
      font-family: inherit;
      font-size: 14px;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--deep);
    }

    .login-panel .login-actions {
      display: flex;
      gap: 8px;
    }

    .login-panel .login-actions button {
      font-size: 13px;
      padding: 0.6rem 0.8rem;
    }

    .login-error {
      font-size: 12px;
      color: #c0453a;
    }

    .spark-star {
      position: fixed;
      pointer-events: none;
      color: var(--gold);
      font-size: 13px;
      opacity: 0;
      z-index: 40;
      text-shadow: 0 0 4px rgba(245, 185, 33, 0.45);
      animation: sparkle 700ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes sparkle {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }

      20% {
        opacity: 0.6;
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(1.2);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.6rem;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <h1>wow i love leetcoding in the summer!</h1>
      <button class="edit-toggle" id="editToggle" title="sign in to edit">☆</button>
    </div>
    <p class="sub">one problem a day since june 11 &middot; <span id="today"></span></p>

    <form class="login-panel" id="loginPanel" style="display:none">
      <input type="email" id="loginEmail" placeholder="email" autocomplete="email" required>
      <input type="password" id="loginPassword" placeholder="password" autocomplete="current-password" required>
      <p class="login-error" id="loginError" style="display:none"></p>
      <div class="login-actions">
        <button type="submit" class="btn-primary">sign in</button>
        <button type="button" class="btn-undo" id="loginCancel">cancel</button>
      </div>
    </form>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">solved</div>
        <div class="stat-value" id="solved">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">moving target</div>
        <div class="stat-value" id="goal">0</div>
      </div>
      <div class="stat burst-source" id="statusBox">
        <div class="stat-label">status</div>
        <div class="stat-value status" id="status">&mdash;</div>
      </div>
    </div>

    <div class="bar-track">
      <div class="bar-fill" id="bar"></div>
    </div>
    <p class="progress-label" id="progressLabel">0 of 0</p>
    <p class="thanks" id="thanksMsg">thanks for coming along with the struggle ...</p>

    <div class="buttons" id="editControls" style="display:none">
      <button class="btn-primary" id="add">solved another one!</button>
      <button class="btn-undo" id="undo">undo</button>
    </div>

    <button class="reset" id="reset" style="display:none">!! reset count</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import {
      getDatabase, ref, onValue, set
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3FdE2rICmZcQndr6xlz-s6TB5B_WQNZo",
      authDomain: "leetcode-tracker-e1914.firebaseapp.com",
      databaseURL: "https://leetcode-tracker-e1914-default-rtdb.firebaseio.com",
      projectId: "leetcode-tracker-e1914",
      storageBucket: "leetcode-tracker-e1914.firebasestorage.app",
      messagingSenderId: "895179339055",
      appId: "1:895179339055:web:e14486e73d80e654141dda"
    };

    const OWNER_UID = "h0EwGXM2h6fsnF8zpMGtgsAwHYs2";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const countRef = ref(db, 'count');

    var START = new Date(2026, 5, 11); // June 11, 2026
    var count = 0;
    var canEdit = false;

    function daysSince() {
      var now = new Date();
      var a = new Date(START.getFullYear(), START.getMonth(), START.getDate());
      var b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var d = Math.floor((b - a) / 86400000) + 1;
      return d < 0 ? 0 : d;
    }

    function render() {
      var goal = daysSince();
      document.getElementById('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).toLowerCase();
      document.getElementById('solved').textContent = count;
      document.getElementById('goal').textContent = goal;

      var pct = goal > 0 ? Math.min(100, Math.round(count / goal * 100)) : 0;
      document.getElementById('bar').style.width = pct + '%';
      document.getElementById('progressLabel').textContent = count + ' of ' + goal + ' (' + pct + '%)';

      var st = document.getElementById('status');
      var diff = count - goal;
      if (diff > 0) {
        st.textContent = '-' + diff + ' behind!';
        st.style.color = 'var(--ahead)';
      } else if (diff === 0) {
        st.textContent = 'on track';
        st.style.color = '#2e7d4f';
      } else if (diff >= -2) {
        st.textContent = (-diff) + ' behind';
        st.style.color = '#c98a0a';
      } else {
        st.textContent = (-diff) + ' behind';
        st.style.color = '#c0453a';
      }
    }

    function burstStars(target) {
      var rect = target.getBoundingClientRect();
      var originX = rect.left + rect.width / 2;
      var originY = rect.top + rect.height / 2;
      var spreadX = rect.width * 1.45;
      var spreadY = rect.height * 1.45;

      target.classList.remove('is-bursting');
      void target.offsetWidth;
      target.classList.add('is-bursting');
      setTimeout(function () { target.classList.remove('is-bursting'); }, 220);

      for (var i = 0; i < 12; i++) {
        var star = document.createElement('span');
        star.className = 'spark-star';
        star.textContent = '✦';
        star.style.left = originX + 'px';
        star.style.top = originY + 'px';
        star.style.fontSize = (8 + Math.random() * 4) + 'px';
        star.style.setProperty('--dx', (Math.random() * spreadX - spreadX / 2) + 'px');
        star.style.setProperty('--dy', (Math.random() * spreadY - spreadY / 2) + 'px');
        document.body.appendChild(star);
        setTimeout(function (node) {
          node.remove();
        }, 700, star);
      }
    }

    document.getElementById('add').onclick = function () {
      burstStars(document.getElementById('statusBox'));
      set(countRef, count + 1);
    };
    document.getElementById('undo').onclick = function () {
      if (count > 0) set(countRef, count - 1);
    };
    document.getElementById('reset').onclick = function () {
      if (confirm('Reset your solved count to 0?')) set(countRef, 0);
    };

    var loginPanel = document.getElementById('loginPanel');
    var loginError = document.getElementById('loginError');

    function hideLoginPanel() {
      loginPanel.style.display = 'none';
      loginError.style.display = 'none';
      loginPanel.reset();
    }

    document.getElementById('editToggle').onclick = function () {
      if (auth.currentUser) {
        if (confirm('Sign out of edit mode?')) signOut(auth);
        return;
      }
      loginPanel.style.display = loginPanel.style.display === 'none' ? 'flex' : 'none';
      if (loginPanel.style.display === 'flex') document.getElementById('loginEmail').focus();
    };

    document.getElementById('loginCancel').onclick = hideLoginPanel;

    loginPanel.onsubmit = function (e) {
      e.preventDefault();
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;
      signInWithEmailAndPassword(auth, email, password).then(function () {
        hideLoginPanel();
      }).catch(function (err) {
        loginError.textContent = 'Sign-in failed: ' + err.message;
        loginError.style.display = 'block';
      });
    };

    onAuthStateChanged(auth, function (user) {
      canEdit = !!user && user.uid === OWNER_UID;
      document.getElementById('editControls').style.display = canEdit ? 'flex' : 'none';
      document.getElementById('reset').style.display = canEdit ? 'block' : 'none';
      document.getElementById('thanksMsg').style.display = canEdit ? 'none' : 'block';
      document.getElementById('editToggle').classList.toggle('is-signed-in', canEdit);
    });

    onValue(countRef, function (snapshot) {
      count = snapshot.val() || 0;
      render();
    });

    render();
  </script>
</body>

</html>
